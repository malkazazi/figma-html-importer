<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Capture for Figma</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    padding: 14px;
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
    color: #111;
    width: 360px;
    background: #fff;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .brand img {
    width: 24px;
    height: 24px;
    border-radius: 5px;
    flex: 0 0 auto;
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0; }

  /* Step indicator */
  .steps {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #bbb;
  }
  .steps .step { display: flex; align-items: center; gap: 6px; }
  .steps .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 17px; height: 17px;
    border-radius: 50%;
    background: #e5e7eb;
    color: #888;
    font-size: 10px;
  }
  .steps .step.active { color: #111; }
  .steps .step.active .num { background: #18a0fb; color: #fff; }
  .steps .step.done .num { background: #cfe9fb; color: #0d6fb8; }
  .steps .sep { flex: 0 0 18px; height: 1px; background: #e5e7eb; }

  label {
    font-size: 10px;
    color: #555;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .bp-section { margin-bottom: 12px; }
  .bp-section > label { display: block; margin-bottom: 6px; }
  .bp-grid {
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    gap: 5px 8px;
    align-items: center;
  }
  .bp-grid input[type=text] {
    font: 11px/1.3 system-ui;
    width: 100%;
    padding: 4px 6px;
    border: 1px solid #ddd;
    border-radius: 5px;
    outline: none;
  }
  .bp-grid input[type=number] {
    width: 60px;
    padding: 4px 6px;
    font-size: 11px;
    border: 1px solid #ddd;
    border-radius: 5px;
    outline: none;
  }
  .bp-grid input:focus { border-color: #18a0fb; }
  .bp-grid .x { color: #888; font-size: 11px; text-align: center; }
  .bp-grid input[type=checkbox] { margin: 0; accent-color: #18a0fb; }

  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .row > label:first-child { min-width: 70px; }
  .field { margin-bottom: 12px; }
  .field > label { display: block; margin-bottom: 6px; }
  .options { display: flex; flex-direction: column; gap: 7px; }
  select {
    font: 12px system-ui;
    padding: 4px 8px;
    border: 1px solid #ddd;
    border-radius: 5px;
    background: #fff;
    outline: none;
  }
  select:focus { border-color: #18a0fb; }

  label.radio, label.checkbox {
    font: 12px/1 -apple-system, system-ui, sans-serif;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    color: #222;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    cursor: pointer;
  }
  label.radio input, label.checkbox input { accent-color: #18a0fb; margin: 0; }
  .rec { color: #067647; font-weight: 600; }

  .pick-hint {
    font-size: 10.5px;
    color: #6b7280;
    background: #f6f7f9;
    border-left: 3px solid #18a0fb;
    padding: 6px 8px;
    margin-bottom: 12px;
    line-height: 1.45;
  }
  .bp-section.disabled { opacity: .45; pointer-events: none; }

  button {
    font: 600 12px/1 system-ui;
    padding: 9px 14px;
    border: 0;
    border-radius: 6px;
    background: #18a0fb;
    color: #fff;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #0d8fe0; }
  button:disabled { background: #aaa; cursor: default; }
  button.secondary { background: #f1f2f4; color: #333; }
  button.secondary:hover { background: #e6e7ea; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button.secondary { width: 38%; }

  .status {
    font-size: 11px;
    color: #555;
    margin-top: 10px;
    min-height: 16px;
    white-space: pre-line;
  }
  .status.error { color: #b42318; }
  .status.success { color: #067647; }

  .footer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #eee;
    font-size: 10.5px;
    color: #999;
    line-height: 1.5;
  }
  .footer code {
    background: #f4f4f5;
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 10px;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="icons/icon-48.png" alt="">
    <h1>Capture for Figma</h1>
  </div>

  <div class="steps">
    <span class="step active" id="step-ind-1"><span class="num">1</span> Breakpoints</span>
    <span class="sep"></span>
    <span class="step" id="step-ind-2"><span class="num">2</span> Options</span>
  </div>

  <!-- ───────────── STEP 1: what to capture ───────────── -->
  <section class="panel" id="panel-1">
    <div class="field">
      <label>What to capture</label>
      <div class="options">
        <label class="radio"><input type="radio" name="mode" value="full" checked> Entire page</label>
        <label class="radio"><input type="radio" name="mode" value="pick"> Select an element</label>
      </div>
    </div>

    <div class="bp-section">
      <label>Breakpoints</label>
      <div class="bp-grid" id="bp-grid"></div>
    </div>

    <div id="pick-hint" class="pick-hint" style="display:none;">
      You'll click an element on the page to capture it. Breakpoints are
      ignored — only the current viewport is captured.
    </div>

    <button id="next">Next →</button>
  </section>

  <!-- ───────────── STEP 2: output options ───────────── -->
  <section class="panel" id="panel-2" style="display:none;">
    <div class="row">
      <label>Theme</label>
      <select id="theme">
        <option value="">(page default)</option>
        <option value="light">light</option>
        <option value="dark">dark</option>
      </select>
    </div>

    <div class="field">
      <label>Output</label>
      <div class="options">
        <label class="radio"><input type="radio" name="output" value="clipboard" checked> Copy to clipboard <span class="rec">(recommended)</span></label>
        <label class="radio"><input type="radio" name="output" value="download"> Download file</label>
      </div>
    </div>

    <div class="field">
      <label>Format</label>
      <div class="options">
        <label class="radio"><input type="radio" name="format" value="fhtml" checked> .fhtml (bundle) <span class="rec">(recommended)</span></label>
        <label class="radio"><input type="radio" name="format" value="html"> .html (raw)</label>
      </div>
    </div>

    <div class="btn-row">
      <button id="back" class="secondary">← Back</button>
      <button id="capture">Capture</button>
    </div>
  </section>

  <div class="status" id="status"></div>

  <div class="footer">
    <code>.fhtml</code>: bundle for the Figma plugin (drop or paste into it).
    <code>.html</code>: raw HTML — saves one file per breakpoint.
  </div>

  <script src="popup.js"></script>
</body>
</html>
